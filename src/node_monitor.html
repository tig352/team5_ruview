<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RuView ESP32 節點監視器</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #081018; color: #edf7ff; }
    header { padding: 24px; text-align: center; border-bottom: 1px solid #243446; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 44px); }
    #source { font-size: 18px; color: #9db1c6; }
    #source.live { color: #56e39f; }
    #source.bad { color: #ff667a; }
    main { width: min(1100px, 94vw); margin: 24px auto; }
    .help { margin-bottom: 22px; padding: 16px 20px; border-radius: 14px; background: #101d2a; font-size: 18px; line-height: 1.6; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .node { min-height: 210px; padding: 20px; border: 3px solid #33465a; border-radius: 18px; background: #111d29; transition: .2s; }
    .node.online { border-color: #35d891; background: #0c2a24; box-shadow: 0 0 26px #1fc88933; }
    .node.offline { border-color: #ff536b; background: #32151c; box-shadow: 0 0 26px #ff536b22; }
    .id { font-size: clamp(36px, 6vw, 68px); font-weight: 850; line-height: 1; }
    .state { margin: 12px 0 18px; font-size: 23px; font-weight: 750; }
    .online .state { color: #56e39f; }
    .offline .state { color: #ff7084; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: #c3d2df; font-size: 17px; }
    .metric strong { display: block; color: white; font-size: 22px; }
    footer { padding: 22px; color: #8195a8; text-align: center; }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } .node { min-height: 180px; } }
  </style>
</head>
<body>
  <header>
    <h1>ESP32 六節點編號監視器</h1>
    <div id="source">正在連接 CSI 服務…</div>
  </header>
  <main>
    <div class="help">拔掉一塊板的電源，等待約 3 秒。變紅並顯示「離線」的卡片，就是那塊板的編號。</div>
    <section id="grid" class="grid"></section>
  </main>
  <footer>只認可 source = esp32 的真實資料；不使用模擬節點。</footer>
  <script>
    const grid = document.querySelector('#grid');
    const sourceEl = document.querySelector('#source');
    const state = new Map();

    for (let id = 1; id <= 6; id++) {
      const card = document.createElement('article');
      card.className = 'node offline';
      card.id = `node-${id}`;
      card.innerHTML = `
        <div class="id">#${id}</div>
        <div class="state">等待資料</div>
        <div class="metrics">
          <div class="metric">訊號<strong class="rssi">—</strong></div>
          <div class="metric">CSI FPS<strong class="fps">—</strong></div>
        </div>`;
      grid.appendChild(card);
      state.set(id, { lastSeen: 0, rssi: null, fps: null, stale: true });
    }

    function render() {
      const now = performance.now();
      for (let id = 1; id <= 6; id++) {
        const s = state.get(id);
        const online = !s.stale && now - s.lastSeen < 3000;
        const card = document.querySelector(`#node-${id}`);
        card.className = `node ${online ? 'online' : 'offline'}`;
        card.querySelector('.state').textContent = online ? '● 在線' : '● 離線';
        card.querySelector('.rssi').textContent = s.rssi == null ? '—' : `${Math.round(s.rssi)} dBm`;
        card.querySelector('.fps').textContent = s.fps == null ? '—' : s.fps.toFixed(1);
      }
    }

    function connect() {
      const ws = new WebSocket('ws://127.0.0.1:8765/ws/sensing');
      ws.onopen = () => { sourceEl.textContent = '已連接，等待真實 ESP32 資料…'; sourceEl.className = ''; };
      ws.onmessage = event => {
        let data;
        try { data = JSON.parse(event.data); } catch { return; }
        if (data.source !== 'esp32') {
          sourceEl.textContent = `資料源不是實機：${data.source ?? '未知'}`;
          sourceEl.className = 'bad';
          return;
        }
        sourceEl.textContent = 'LIVE — 真實 ESP32 CSI';
        sourceEl.className = 'live';
        for (const node of data.nodes || []) {
          const id = Number(node.node_id);
          if (!state.has(id)) continue;
          const s = state.get(id);
          s.lastSeen = performance.now() - Math.min(Number(node.sync?.staleness_ms || 0), 10000);
          s.rssi = Number(node.rssi_dbm);
          s.fps = Number(node.sync?.csi_fps_ema || 0);
          s.stale = Boolean(node.stale || node.sync?.is_valid === false);
        }
        render();
      };
      ws.onclose = () => {
        sourceEl.textContent = 'CSI 服務已斷線，正在重連…';
        sourceEl.className = 'bad';
        setTimeout(connect, 1500);
      };
      ws.onerror = () => ws.close();
    }

    setInterval(render, 500);
    connect();
  </script>
</body>
</html>
